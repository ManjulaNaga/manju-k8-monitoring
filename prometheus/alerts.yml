groups:
  - name: jenkins-probes
    rules:
      - alert: JenkinsLivenessFailed
        expr: probe_success{probe="liveness", instance="jenkins:8080"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Jenkins is not accepting connections"
          description: "TCP probe to {{ $labels.instance }} has failed for 1 minute."

      - alert: JenkinsNotReady
        expr: probe_success{probe="readiness"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Jenkins is up but not ready"
          description: "/login has not returned HTTP 2xx for 2 minutes."

      - alert: JenkinsStartupTooSlow
        expr: probe_success{probe="startup"} == 0 and on() (time() - max(container_start_time_seconds{container_label_com_docker_compose_service="jenkins"})) > 300
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Jenkins has not finished starting after 5 minutes"

      - alert: JenkinsScrapeDown
        expr: up{job="jenkins"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus cannot scrape Jenkins metrics"

  - name: jenkins-resources
    rules:
      - alert: JenkinsHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service="jenkins"}[2m]))
            / max(container_spec_cpu_quota{container_label_com_docker_compose_service="jenkins"}
                  / container_spec_cpu_period{container_label_com_docker_compose_service="jenkins"}) * 100 > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Jenkins CPU above 80% of its limit for 5 minutes"

      - alert: JenkinsHighMemory
        expr: |
          max(container_memory_working_set_bytes{container_label_com_docker_compose_service="jenkins"})
            / max(container_spec_memory_limit_bytes{container_label_com_docker_compose_service="jenkins"}) * 100 > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Jenkins memory above 90% of its limit for 5 minutes"

      - alert: JenkinsHeapHigh
        expr: vm_memory_heap_usage{job="jenkins"} > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Jenkins JVM heap above 90%"
